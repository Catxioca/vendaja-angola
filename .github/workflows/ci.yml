name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_database"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/ci_database
      TEST_DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/ci_database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run db:generate
      - run: npm --workspace @angola/backend run prisma:validate
      - run: npm --workspace @angola/backend exec prisma migrate deploy -- --schema=prisma/schema.prisma
      - run: npm --workspace @angola/backend run test:integration
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npm --workspace @angola/backend run build
      - run: npm run build:desktop
      - run: git diff --check
