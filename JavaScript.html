  const setLanguage = (lang) => {
    if (!TRANSLATIONS[lang]) lang = 'pt';
    currentLang = lang;
    const dict = TRANSLATIONS[lang];

    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const key = el.getAttribute('data-i18n');
      if (dict[key]) {
        el.textContent = dict[key];
      }
    });

    if ($('perfil-idioma')) {
      $('perfil-idioma').value = lang;
    }
  };

  // ===========================================================================
  // UTILITÁRIOS
  // ===========================================================================

  const escapeHtml = (value) =>
    String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  const showNotification = (message, type = 'info') => {
    const stack = $('toast-stack');
    if (!stack) return;

    const titles = {
      success: 'Sucesso',
      error: 'Erro',
      warning: 'Aviso',
      info: 'Informação'
    };

    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.innerHTML = '<div><strong></strong><p></p></div>';

    const title = el.querySelector('strong');
    const text = el.querySelector('p');

    if (title) title.textContent = titles[type] || titles.info;
    if (text) text.textContent = String(message || '');

    stack.appendChild(el);

    window.setTimeout(() => {
      if (el.parentNode) el.remove();
    }, TOAST_MS);
  };

  const setButtonLoading = (button, isLoading) => {
    if (!button) return;

    button.disabled = isLoading;
    button.classList.toggle('is-loading', isLoading);
    button.setAttribute('aria-busy', isLoading ? 'true' : 'false');
  };

  const normalizeResult = (result) => {
    if (!result) {
      throw new Error('O servidor não devolveu uma resposta válida.');
    }

    if (result.status === 'error' || result.success === false) {
      throw new Error(result.message || 'Não foi possível concluir a operação.');
    }

    return result;
  };

  // ===========================================================================
  // GOOGLE APPS SCRIPT
  // ===========================================================================

  const callServer = (fnName, ...args) =>
    new Promise((resolve, reject) => {
      if (
        typeof google === 'undefined' ||
        !google.script ||
        !google.script.run
      ) {
        reject(
          new Error(
            'API google.script.run indisponível. Publique a Aplicação Web.'
          )
        );
        return;
      }

      try {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler((error) => {
            const message =
              error && error.message
                ? error.message
                : String(error || 'Falha de comunicação com o servidor.');

            reject(new Error(message));
          })[fnName](...args);
      } catch (error) {
        reject(
          new Error(
            error?.message ||
              `A função "${fnName}" não está disponível no servidor.`
          )
        );
      }
    });

  const runWithLoading = async (button, fnName, args = []) => {
    setButtonLoading(button, true);

    try {
      const result = await callServer(fnName, ...args);
      return normalizeResult(result);
    } finally {
      setButtonLoading(button, false);
    }
  };

  // ===========================================================================
  // SPA / ROTAS
  // ===========================================================================

  const showScreen = (screenId) => {
    if (!SCREENS.includes(screenId)) return;

    const isDashboard = screenId === 'dashboard-container';

    $('auth-shell')?.classList.toggle('hidden', isDashboard);
    $('dashboard-container')?.classList.toggle('hidden', !isDashboard);

    AUTH_SCREENS.forEach((id) => {
      $(id)?.classList.toggle('hidden', id !== screenId);
    });
  };

  const openModule = (modName) => {
    document.querySelectorAll('.module').forEach((mod) => {
      mod.classList.remove('is-visible');
    });

    const targetMod = $(`mod-${modName}`);
    if (targetMod) {
      targetMod.classList.add('is-visible');
    }

    document.querySelectorAll('.sidebar .nav-item, .nav-mobile .nav-item').forEach((item) => {
      if (item.getAttribute('data-module') === modName) {
        item.classList.add('is-active');
      } else {
        item.classList.remove('is-active');
      }
    });

    if (modName === 'admin') {
      loadAdminUsers();
      loadAdminTurnos();
      loadAdminLocais();
      loadAdminLinks();
      loadAdminInscricoes();
    }
  };

  const initials = (nome = '', apelido = '') => {
    const first = String(nome).trim().charAt(0);
    const last = String(apelido).trim().charAt(0);

    const value = `${first}${last}`.toUpperCase();

    return value || 'U';
  };

  const cloneMobileNav = () => {
    const sidebar = $('sidebar');
    const navMobile = $('nav-mobile');
    if (sidebar && navMobile) {
      navMobile.innerHTML = sidebar.innerHTML;
      navMobile.querySelectorAll('.nav-item').forEach((btn) => {
        btn.addEventListener('click', () => {
          const mod = btn.getAttribute('data-module');
          if (mod) openModule(mod);
        });
      });
    }
  };

  // ===========================================================================
  // SESSÃO
  // ===========================================================================

  const isAdmin = () =>
    !!sessionUser &&
    sessionUser.perfil === 'Administrador' &&
    String(sessionUser.status || 'Ativo').toLowerCase() === 'ativo';

  const applySessionToHeader = (user) => {
    if (!user) return;

    const fullName =
      `${user.nome || ''} ${user.apelido || ''}`.trim() ||
      user.email ||
      'Utilizador';

    if ($('user-fullname')) {
      $('user-fullname').textContent = fullName;
    }

    if ($('user-perfil')) {
      $('user-perfil').textContent = user.perfil || 'Utilizador';
    }

    if ($('user-avatar')) {
      $('user-avatar').textContent = initials(user.nome, user.apelido);
    }

    const admin = isAdmin();

    $('nav-admin')?.classList.toggle('hidden', !admin);

    document
      .querySelectorAll('#nav-mobile [data-module="admin"]')
      .forEach((item) => {
        item.classList.toggle('hidden', !admin);
      });

    if (!admin && $('mod-admin')?.classList.contains('is-visible')) {
      openModule('turnos');
    }
  };

  const enterDashboard = async (user) => {
    if (!user) {
      throw new Error('Dados de sessão inválidos.');
    }

    sessionUser = {
      email: user.email || '',
      nome: user.nome || '',
      apelido: user.apelido || '',
      celular: user.celular || '',
      perfil: user.perfil || 'Utilizador',
      status: user.status || 'Ativo',
      idioma: user.idioma || 'pt'
    };

    setLanguage(sessionUser.idioma);
    applySessionToHeader(sessionUser);
    fillProfileForm(sessionUser);

    showScreen('dashboard-container');
    openModule('turnos');

    cloneMobileNav();

    await loadLocais();

    if (isAdmin()) {
      await loadAdminUsers();
    }
  };

  // ===========================================================================
  // AUTENTICAÇÃO
  // ===========================================================================

  const handleRegister = async (event) => {
    event.preventDefault();

    const formData = {
      Nome: $('reg-nome')?.value.trim() || '',
      Apelido: $('reg-apelido')?.value.trim() || '',
      Celular: $('reg-celular')?.value.trim() || '',
      Email: $('reg-email')?.value.trim() || '',
      ConfirmarEmail: $('reg-email2')?.value.trim() || '',
      Senha: $('reg-senha')?.value || ''
    };

    if (
      !formData.Nome ||
      !formData.Apelido ||
      !formData.Celular ||
      !formData.Email ||
      !formData.ConfirmarEmail ||
      !formData.Senha
    ) {
      showNotification('Preencha todos os campos obrigatórios.', 'error');
      return;
    }

    if (
      formData.Email.toLowerCase() !==
      formData.ConfirmarEmail.toLowerCase()
    ) {
      showNotification(
        'O e-mail e a confirmação não coincidem.',
        'error'
      );
      return;
    }

    if (formData.Senha.length < MIN_PASSWORD_LENGTH) {
      showNotification(
        `A senha deve ter pelo menos ${MIN_PASSWORD_LENGTH} caracteres.`,
        'error'
      );
      return;
    }

    try {
      const result = await runWithLoading(
        $('btn-register'),
        'registerUser',
        [formData]
      );

      showNotification(
        result.message || 'Conta criada com sucesso!',
        'success'
      );

      if ($('login-email')) {
        $('login-email').value = formData.Email;
      }

      if ($('login-senha')) {
        $('login-senha').value = '';
      }

      showScreen('screen-login');
    } catch (error) {
      showNotification(
        error.message || 'Não foi possível criar a conta.',
        'error'
      );
    }
  };

  const handleLogin = async (event) => {
    event.preventDefault();

    const email = $('login-email')?.value.trim() || '';

    const novaSenha = $('reset-senha')?.value || '';

      return;

    if (novaSenha.length < MIN_PASSWORD_LENGTH) {

        'error'

      return;

          const nMes = prompt('Novo Mês (opcional):', btn.getAttribute('data-mes'));
          if (nMes === null) return;
          const nUrl = prompt('Nova URL:', btn.getAttribute('data-url'));
          if (nUrl === null) return;

          try {
            const resUp = await callServer('updateLinkAdmin', sessionUser.email, {
              id: lId,
              tipo: nTipo,
              mes: nMes,
              url: nUrl
            });
            normalizeResult(resUp);
            showNotification('Link atualizado!', 'success');
            loadAdminLinks();
          } catch (e) {
            showNotification(e.message || 'Erro ao atualizar link.', 'error');
          }
        });
      });

      tbody.querySelectorAll('.btn-del-lnk').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const lId = btn.getAttribute('data-id');
          if (!confirm('Deseja realmente excluir este link?')) return;

          try {
            const resDel = await callServer('deleteLinkAdmin', sessionUser.email, lId);
            normalizeResult(resDel);
            showNotification('Link eliminado!', 'success');
            loadAdminLinks();
          } catch (e) {
            showNotification(e.message || 'Erro ao excluir link.', 'error');
          }
        });
      });
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="5">Erro: ${escapeHtml(err.message)}</td></tr>`;
    }
  };

  const handleAdminAddLink = async (e) => {
    e.preventDefault();
    const payload = {
      tipo: $('adm-lnk-tipo')?.value,
      mes: $('adm-lnk-mes')?.value.trim(),
      url: $('adm-lnk-url')?.value.trim()
    };

    try {
      const res = await runWithLoading($('btn-admin-add-link'), 'createLinkAdmin', [sessionUser.email, payload]);
      showNotification(res.message || 'Link criado com sucesso!', 'success');
      $('form-admin-link')?.reset();
      loadAdminLinks();
    } catch (err) {
      showNotification(err.message || 'Erro ao criar link.', 'error');
    }
  };

  const loadAdminInscricoes = async () => {
    const tbody = $('tbl-admin-inscricoes-body');
    if (!tbody || !isAdmin()) return;

    try {
      const res = await callServer('getAllInscricoesAdmin', sessionUser.email);
      normalizeResult(res);

      const inscricoes = res.inscricoes || [];
      if (inscricoes.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7">Nenhuma inscrição encontrada.</td></tr>';
        return;
      }

      tbody.innerHTML = inscricoes.map((i) => `
        <tr>
          <td>${escapeHtml(i.id)}</td>
          <td>${escapeHtml(i.nome)} ${escapeHtml(i.apelido)}</td>
          <td>${escapeHtml(i.email)}</td>
          <td>${escapeHtml(i.turnoLocal || '-')}</td>
          <td>${escapeHtml(i.turnoData || '-')} (${escapeHtml(i.turnoHorario || '-')})</td>
          <td><span class="badge ${i.status === 'Ativo' ? 'badge-blue' : 'badge-red'}">${escapeHtml(i.status)}</span></td>
          <td>
            <button type="button" class="btn btn-outline btn-sm btn-edit-insc" data-id="${escapeHtml(i.id)}" data-turnoid="${escapeHtml(i.turnoId)}" data-status="${escapeHtml(i.status)}">Editar</button>
          </td>
        </tr>
      `).join('');

      tbody.querySelectorAll('.btn-edit-insc').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const iId = btn.getAttribute('data-id');
          const nTurnoId = prompt('Novo ID do Turno:', btn.getAttribute('data-turnoid'));
          if (nTurnoId === null) return;
          const nStatus = prompt('Novo Status (Ativo/Cancelado):', btn.getAttribute('data-status'));
          if (nStatus === null) return;

          try {
            const resUp = await callServer('updateInscricaoAdmin', sessionUser.email, {
              id: iId,
              turnoId: nTurnoId,
              status: nStatus
            });
            normalizeResult(resUp);
            showNotification('Inscrição atualizada!', 'success');
            loadAdminInscricoes();
          } catch (e) {
            showNotification(e.message || 'Erro ao atualizar inscrição.', 'error');
          }
        });
      });
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="7">Erro: ${escapeHtml(err.message)}</td></tr>`;
    }
  };

  const handleGerarRelatorio = async () => {
    const container = $('relatorio-resultado');
    if (!container) return;

    try {
      const res = await runWithLoading($('btn-gerar-relatorio'), 'getConsolidatedReport', [sessionUser.email]);
      normalizeResult(res);

      const r = res.relatorio;
      container.innerHTML = `
        <h3>Relatório Consolidado</h3>
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:16px; margin-top:16px;">
          <div class="card" style="background:#f8fafc;">
            <h4>Utilizadores</h4>
            <p>Total: <strong>${r.usuarios.total}</strong></p>
            <p>Ativos: <strong>${r.usuarios.ativos}</strong></p>
          </div>
          <div class="card" style="background:#f8fafc;">
            <h4>Turnos & Vagas</h4>
            <p>Total Turnos: <strong>${r.turnos.total}</strong></p>
            <p>Total Vagas: <strong>${r.turnos.vagasTotais}</strong></p>
          </div>
          <div class="card" style="background:#f8fafc;">
            <h4>Inscrições</h4>
            <p>Total: <strong>${r.inscricoes.total}</strong></p>
            <p>Ativas: <strong>${r.inscricoes.ativas}</strong></p>
          </div>
          <div class="card" style="background:#f8fafc;">
            <h4>Acessos</h4>
            <p>Total Registados: <strong>${r.acessos.total}</strong></p>
            <p>Sucessos: <strong>${r.acessos.sucesso}</strong></p>
            <p>Falhas: <strong>${r.acessos.falha}</strong></p>
          </div>
          <div class="card" style="background:#f8fafc;">
            <h4>Formulários</h4>
            <p>Links Configurados: <strong>${r.formularios.totalLinks}</strong></p>
          </div>
        </div>
      `;
    } catch (err) {
      showNotification(err.message || 'Erro ao gerar relatório.', 'error');
    }
  };

  // ===========================================================================
  // EVENT LISTENERS
  // ===========================================================================

  const initEvents = () => {
    document.querySelectorAll('[data-screen]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const target = btn.getAttribute('data-screen');
        if (target) showScreen(target);
      });
    });

    $('screen-register')?.addEventListener('submit', handleRegister);
    $('screen-login')?.addEventListener('submit', handleLogin);
    $('screen-forgot')?.addEventListener('submit', handleRequestReset);
    $('screen-reset')?.addEventListener('submit', handleResetPassword);

    $('btn-logout')?.addEventListener('click', handleLogout);
    $('form-perfil')?.addEventListener('submit', handleUpdateProfile);

    $('filtro-local')?.addEventListener('change', (e) => {
      loadTurnosPorLocal(e.target.value);
    });

    $('btn-abrir-form')?.addEventListener('click', handleAbrirForm);
    $('btn-ocorrencia')?.addEventListener('click', handleAbrirOcorrencia);
    $('btn-cancelamento')?.addEventListener('click', handleAbrirCancelamento);

    document.querySelectorAll('.sidebar .nav-item').forEach((btn) => {
      btn.addEventListener('click', () => {
        const mod = btn.getAttribute('data-module');
        if (mod) openModule(mod);
      });
    });

    document.querySelectorAll('.subtabs .subtab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.subtabs .subtab').forEach((t) => {
          t.classList.remove('is-active');
          t.setAttribute('aria-selected', 'false');
        });
        tab.classList.add('is-active');
        tab.setAttribute('aria-selected', 'true');

        const target = tab.getAttribute('data-admin');
        document.querySelectorAll('.admin-panel').forEach((p) => {
          p.classList.add('hidden');
        });
        $(`admin-${target}`)?.classList.remove('hidden');
      });
    });

    $('form-admin-user')?.addEventListener('submit', handleAdminAddUser);
    $('form-admin-turno')?.addEventListener('submit', handleAdminAddTurno);
    $('form-admin-local')?.addEventListener('submit', handleAdminAddLocal);
    $('form-admin-link')?.addEventListener('submit', handleAdminAddLink);
    $('btn-gerar-relatorio')?.addEventListener('click', handleGerarRelatorio);

    $('btn-menu')?.addEventListener('click', () => {
      const navMobile = $('nav-mobile');
      if (navMobile) {
        navMobile.classList.toggle('is-visible');
      }
    });
  };

  document.addEventListener('DOMContentLoaded', () => {
    initEvents();
    showScreen('screen-login');
  });
})();
</script>
