# ==============================================================================
# Nginx Configuration for VendaJá Angola Cloud
# Domains: vendaja.ao, www.vendaja.ao, api.vendaja.ao
# VPS IP: 46.202.173.102
# ==============================================================================

upstream vendaja_backend_upstream {
    server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. API Subdomain: api.vendaja.ao (Node.js Backend via PM2)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.vendaja.ao;

    # Certbot ACME Challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.vendaja.ao;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/api.vendaja.ao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vendaja.ao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 64M;

    # Health Checks - Dedicated Direct Location
    location ~ ^/health(/.*)?$ {
        proxy_pass http://vendaja_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        access_log /var/log/nginx/vendaja-health.log;
    }

    # All API Endpoints & WebSockets
    location / {
        proxy_pass http://vendaja_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    access_log /var/log/nginx/api.vendaja.ao-access.log;
    error_log /var/log/nginx/api.vendaja.ao-error.log warn;
}

# ------------------------------------------------------------------------------
# 2. Main Web & Portals: vendaja.ao and www.vendaja.ao (React 19 SPA)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name vendaja.ao www.vendaja.ao;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://vendaja.ao$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vendaja.ao;

    ssl_certificate /etc/letsencrypt/live/vendaja.ao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vendaja.ao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://vendaja.ao$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vendaja.ao;

    root /var/www/vendaja-web;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/vendaja.ao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vendaja.ao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SPA Routing: Fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Manifest and Service Worker
    location ~* \.(webmanifest|json)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    access_log /var/log/nginx/vendaja.ao-access.log;
    error_log /var/log/nginx/vendaja.ao-error.log warn;
}
