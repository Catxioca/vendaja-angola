services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
      POSTGRES_DB: angola_commerce
    ports: ["5432:5432"]
    volumes: [commerce-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d angola_commerce"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./apps/backend
    environment:
      DATABASE_URL: postgresql://commerce:commerce@postgres:5432/angola_commerce
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  commerce-postgres:
