appId: ao.commerce.desktop
productName: VendaJá Angola
directories:
  output: release
  app: apps/desktop
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
files:
  - dist/**
  - "!dist/win-unpacked/**"
  - package.json
extraResources:
  - from: public.pem
    to: public.pem
  - from: apps/backend/dist
    to: backend/dist
  - from: apps/backend/package.json
    to: backend/package.json
  - from: node_modules/@prisma/client
    to: backend/node_modules/@prisma/client
  - from: node_modules/.prisma
    to: backend/node_modules/.prisma
asar: true
compression: maximum
publish: []
win:
  target: nsis
  signAndEditExecutable: false
linux:
  target: AppImage
mac:
  target: dmg
