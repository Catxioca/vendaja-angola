services:
  # ============================================================================
  # BACKEND API: Web Service Node.js (VendaJá Angola Cloud API)
  # ============================================================================
  - type: web
    name: vendaja-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build:shared && npm --workspace @angola/backend run build
    preDeployCommand: npx prisma migrate deploy --schema=apps/backend/prisma/schema.prisma
    startCommand: node apps/backend/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FISCAL_CONFIG_KEY
        sync: false
      - key: COMPANY_NIF
        value: "5001234567"
      - key: COMPANY_NAME
        value: "VendaJá Angola Lda"
      - key: CORS_ORIGIN
        value: "*"
      - key: TRUST_PROXY
        value: "true"

  # ============================================================================
  # FRONTEND WEB: Static Site (ERP Web, Portais Cliente/Fornecedor/RH, Copilot)
  # ============================================================================
  - type: static
    name: vendaja-web
    plan: free
    buildCommand: npm install && npm run build:shared && npm --workspace @angola/web run build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://vendaja-api.onrender.com
